name: Update Snapshots

on:
  workflow_dispatch:

jobs:
  update_snapshots:
    runs-on: ubuntu-22.04
    steps:
      - name: Fail if branch is main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on main"
          exit 1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run Playwright tests
        id: playwright
        run: npm run e2e:snapshots
      - name: Commit Playwright updated snapshots
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' && github.ref != 'refs/heads/main' }}
        with:
          add: e2e
          default_author: github_actions
          message: "🤖 update snapshots"
